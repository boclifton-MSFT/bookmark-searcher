<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Bookmark Searcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div id="mainDiv" class="popup-container">
    <h1 class="popup-title">Search Bookmarks</h1>
    <label for="bmSearch" class="visually-hidden">Search bookmarks</label>
    <input id="bmSearch" class="search-input" placeholder="Text to search" autofocus />
    <button type="submit" class="search-button" id="bmSearchBtn">Search</button>
    <p class="result-count" id="resultCount"></p>
    <div id="results" class="results"></div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
