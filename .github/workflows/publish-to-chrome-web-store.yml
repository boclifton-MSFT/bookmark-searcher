name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package extension
        run: zip -r "$RUNNER_TEMP/extension.zip" icons lib popup manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ${{ runner.temp }}/extension.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      id-token: write
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - uses: hamzahamidi/publish-to-chrome-web-store@v1
        with:
          access-token: ${{ steps.auth.outputs.access_token }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: ${{ vars.CWS_ITEM_ID }}
          zip: extension.zip
          publish: true
